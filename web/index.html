<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HeatCanyon — Midtown Manhattan</title>
<meta name="description" content="A 3D street-canyon heat exposure model of Midtown Manhattan, built on the FortyGuard Temperature API." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2307090d%27/%3E%3Crect x=%274%27 y=%2710%27 width=%277%27 height=%2718%27 fill=%27%23f6d746%27/%3E%3Crect x=%2713%27 y=%2716%27 width=%276%27 height=%2712%27 fill=%27%23bc3754%27/%3E%3Crect x=%2721%27 y=%275%27 width=%277%27 height=%2723%27 fill=%27%23f98e25%27/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./css/app.css" />

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>

<div id="app">
  <canvas id="gl"></canvas>

  <div id="boot">
    <h1>HeatCanyon</h1>
    <div class="bar"><i id="boot-bar"></i></div>
    <div class="sub" id="boot-msg">loading</div>
  </div>

  <!-- LEFT ---------------------------------------------------------------- -->
  <aside id="left" class="panel">
    <header class="brand">
      <h1>HeatCanyon</h1>
      <p id="brand-sub"></p>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="view" aria-pressed="true">View</button>
      <button data-tab="whatif" aria-pressed="false">What if</button>
      <button data-tab="ask" aria-pressed="false">Ask</button>
    </nav>

    <div class="tabbody">
      <section id="tab-view" class="tabpane">
        <div class="seg" id="layers"></div>
        <div id="legend">
          <div class="ramp" id="legend-ramp"></div>
          <div class="ticks" id="legend-ticks"></div>
          <p class="cap" id="legend-cap"></p>
        </div>
        <div class="camrow">
          <button id="cam-orbit" aria-pressed="true">Fly over</button>
          <button id="cam-street" aria-pressed="false">Walk the street</button>
          <button id="cam-next" hidden>Next street</button>
        </div>
        <p class="hint" id="cam-hint"></p>
      </section>

      <section id="tab-whatif" class="tabpane" hidden></section>
      <section id="tab-ask" class="tabpane" hidden></section>
    </div>
  </aside>

  <!-- RIGHT --------------------------------------------------------------- -->
  <aside id="side" class="panel">
    <div class="hd">
      <h2 id="side-title">Where to act first</h2>
      <p id="side-sub"></p>
    </div>
    <div class="body" id="side-body"></div>
  </aside>

  <!-- BOTTOM -------------------------------------------------------------- -->
  <div id="time" class="panel">
    <div class="row">
      <button class="play" id="play" title="Play the day">&#9658;</button>
      <div class="hours" id="hours"></div>
    </div>
    <div class="meta" id="time-meta"></div>
  </div>

  <div id="hover"></div>
</div>

<script type="module" src="./js/main.js"></script>
